<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8b5cf6" />
    <title>Download BlueCord</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: radial-gradient(circle at top, #312e81, #0f172a 55%);
      }

      main {
        width: min(520px, 100%);
        padding: 36px 28px;
        text-align: center;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 18px;
        box-shadow: 0 24px 70px rgba(2, 6, 23, 0.45);
      }

      h1 {
        margin: 0 0 10px;
      }

      p {
        color: #cbd5e1;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        margin-top: 16px;
        padding: 12px 18px;
        border-radius: 10px;
        background: #8b5cf6;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover {
        background: #7c3aed;
      }

      .secondary {
        display: block;
        margin-top: 18px;
        padding: 0;
        background: transparent;
        color: #bfdbfe;
        font-weight: 500;
      }

      .secondary:hover {
        background: transparent;
        color: #dbeafe;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Download BlueCord</h1>
      <p>Download the latest BlueCord project files from the main branch on GitHub.</p>
      <a href="https://github.com/SHAD0W3D-2/Discord/archive/refs/heads/main.zip">Download project ZIP</a>
      <a class="secondary" href="https://github.com/SHAD0W3D-2/Discord">View the project on GitHub</a>
    </main>
  </body>
</html>
